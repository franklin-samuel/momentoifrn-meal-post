spring.application.name=meal.post
r2.endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket-name=${R2_BUCKET_NAME}
r2.public-base-url=${R2_PUBLIC_BASE_URL}
instagram.access-token=${IG_ACCESS_TOKEN}
instagram.user-id=${IG_USER_ID}
instagram.api-version=v21.0
server.servlet.session.tracking-modes=cookie
instagram.login-type=${IG_LOGIN_TYPE:FACEBOOK}
instagram.app-id=${IG_APP_ID:}
instagram.app-secret=${IG_APP_SECRET:}
instagram.token-refresh-threshold-days=15
r2.token-bucket-name=${R2_TOKEN_BUCKET_NAME:}
