<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momento IFRN — Postar Cardápio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent: #FF7C15;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .accent-bg { background-color: var(--accent); }
        .accent-text { color: var(--accent); }
        .accent-ring:focus { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
    </style>
</head>
<body class="min-h-screen bg-neutral-100 flex items-center justify-center p-4">

<div class="w-full max-w-md">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-extrabold text-neutral-900">Momento IFRN</h1>
        <p class="text-neutral-500 text-sm mt-1">Publique o cardápio direto nos Stories</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6">

        <div th:if="${mensagem}" class="mb-4 rounded-lg bg-green-50 border border-green-200 text-green-800 text-sm px-4 py-3" th:text="${mensagem}"></div>
        <div th:if="${erro}" class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm px-4 py-3" th:text="${erro}"></div>

        <form th:action="@{/story}" th:object="${dinnerMenu}" method="post">

            <label class="block text-sm font-semibold text-neutral-700 mb-2">Refeição</label>
            <div id="segmented" class="grid grid-cols-3 gap-1 bg-neutral-100 rounded-xl p-1 mb-5">

                <input type="radio" id="opt-snack" th:field="*{mealType}" value="SNACK" class="hidden seg-input" data-color="#FFCC00">
                <label for="opt-snack" class="seg-label cursor-pointer text-center rounded-lg py-2.5 text-sm font-bold text-neutral-500 transition-all">
                    Lanche
                </label>

                <input type="radio" id="opt-lunch" th:field="*{mealType}" value="LUNCH" class="hidden seg-input" data-color="#FF7C15">
                <label for="opt-lunch" class="seg-label cursor-pointer text-center rounded-lg py-2.5 text-sm font-bold text-neutral-500 transition-all">
                    Almoço
                </label>

                <input type="radio" id="opt-dinner" th:field="*{mealType}" value="DINNER" class="hidden seg-input" data-color="#00BF63">
                <label for="opt-dinner" class="seg-label cursor-pointer text-center rounded-lg py-2.5 text-sm font-bold text-neutral-500 transition-all">
                    Janta
                </label>

            </div>

            <label for="text" class="block text-sm font-semibold text-neutral-700 mb-2">Cardápio de hoje</label>
            <textarea
                    id="text"
                    th:field="*{text}"
                    rows="6"
                    placeholder="Ex: Arroz, feijão, frango grelhado, salada e suco de laranja"
                    class="w-full resize-none rounded-xl border border-neutral-200 px-4 py-3 text-neutral-800 text-sm accent-ring focus:border-transparent"
            ></textarea>

            <button
                    type="submit"
                    id="submit-btn"
                    class="accent-bg w-full mt-5 text-white font-bold py-3 rounded-xl transition-colors hover:opacity-90 active:scale-[0.99]"
            >
                Publicar no Instagram
            </button>

        </form>
    </div>

    <p class="text-center text-neutral-400 text-xs mt-5">@momentoifrn</p>
</div>

<script>
    const inputs = document.querySelectorAll('.seg-input');
    const root = document.documentElement;
    const submitBtn = document.getElementById('submit-btn');

    function applySelection(input) {
        const color = input.dataset.color;
        root.style.setProperty('--accent', color);

        inputs.forEach(i => {
            const label = document.querySelector(`label[for="${i.id}"]`);
            if (i.checked) {
                label.style.backgroundColor = color;
                label.style.color = '#fff';
                label.classList.remove('text-neutral-500');
            } else {
                label.style.backgroundColor = 'transparent';
                label.style.color = '';
                label.classList.add('text-neutral-500');
            }
        });
    }

    inputs.forEach(input => {
        input.addEventListener('change', () => applySelection(input));
        if (input.checked) applySelection(input);
    });

    const checkedInput = document.querySelector('.seg-input:checked');
    if (checkedInput) applySelection(checkedInput);
</script>

</body>
</html>
